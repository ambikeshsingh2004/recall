# One-step run:  cp .env.example .env  (add keys)  then  docker compose up -d --build
name: recall

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall}   # set a real one in .env when deploying
      POSTGRES_DB: recall
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # localhost only; 5433 because a Windows Postgres already uses 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: recall:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://recall:${POSTGRES_PASSWORD:-recall}@db:5432/recall
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # no auth yet (PRD §14), so localhost only
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the fallback reach Ollama on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
